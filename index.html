<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freelance Invoice & Tax Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-6">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-lg border border-slate-200 p-8">
    <span class="text-xs font-semibold uppercase tracking-wider bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full">Free Micro-Tool</span>
    <h1 class="text-2xl font-bold mt-3 text-slate-900">Project Fee & Tax Calculator</h1>
    <p class="text-sm text-slate-500 mt-1">Calculate your exact invoice total and net take-home pay instantly.</p>

    <div class="space-y-4 mt-6">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Project Fee ($ or ₹)</label>
        <input id="fee" type="number" value="50000" oninput="calculate()" 
               class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">GST / Sales Tax (%)</label>
          <input id="gst" type="number" value="18" oninput="calculate()" 
                 class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Income Tax Reserve (%)</label>
          <input id="taxReserve" type="number" value="20" oninput="calculate()" 
                 class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
      </div>
    </div>

    <div class="mt-6 bg-slate-900 text-white rounded-xl p-5 space-y-3">
      <div class="flex justify-between text-sm text-slate-300">
        <span>GST / Tax Added to Invoice:</span>
        <span id="gstAmount" class="font-semibold text-white">9,000</span>
      </div>
      <div class="flex justify-between text-sm text-slate-300">
        <span>Total Client Invoice Amount:</span>
        <span id="totalInvoice" class="font-semibold text-indigo-300">59,000</span>
      </div>
      <hr class="border-slate-700">
      <div class="flex justify-between items-baseline pt-1">
        <span class="text-sm font-medium text-slate-200">Your Net Take-Home Pay:</span>
        <span id="netPay" class="text-2xl font-bold text-emerald-400">40,000</span>
      </div>
    </div>
  </div>

  <script>
    function calculate() {
      const fee = parseFloat(document.getElementById('fee').value) || 0;
      const gstRate = parseFloat(document.getElementById('gst').value) || 0;
      const reserveRate = parseFloat(document.getElementById('taxReserve').value) || 0;

      const gstAmount = fee * (gstRate / 100);
      const totalInvoice = fee + gstAmount;
      const netPay = fee - (fee * (reserveRate / 100));

      document.getElementById('gstAmount').innerText = gstAmount.toLocaleString();
      document.getElementById('totalInvoice').innerText = totalInvoice.toLocaleString();
      document.getElementById('netPay').innerText = netPay.toLocaleString();
    }
    calculate();
  </script>
</body>
</html>
